interface:
  display_name: "Adaptive Subagent Orchestrator"
  short_description: "Delegates independent engineering work when parallelism is worthwhile"
  default_prompt: >
    Use $adaptive-subagent-orchestrator to evaluate this task for independent
    workstreams. If the delegation criteria are met, explicitly spawn the
    minimum necessary bounded subagents, wait for all required results,
    validate their evidence, and integrate the final outcome. Otherwise
    complete the task directly.

policy:
  allow_implicit_invocation: true
